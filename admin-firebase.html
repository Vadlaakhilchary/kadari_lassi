<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kadari Admin - Firebase Edition</title>
    <link rel="icon" type="image/png" href="images/k_logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0a1628; 
            color: #fff; 
            min-height: 100vh; 
        }

        /* ========== LOGIN SCREEN ========== */
        #loginScreen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1628 0%, #1a3a6b 100%);
        }

        #loginScreen.hidden {
            display: none;
        }

        .login-container {
            background: rgba(13, 31, 60, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .login-container h1 {
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #d4af37, #e8c547);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-container p {
            text-align: center;
            color: #b0c4de;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            color: #b0c4de;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            background: rgba(10, 22, 40, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #d4af37, #e8c547);
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.5rem;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
        }

        .login-error {
            color: #ff6b6b;
            text-align: center;
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }

        .login-error.show {
            display: block;
        }

        /* ========== DASHBOARD LAYOUT ========== */
        #dashboard {
            display: none;
        }

        #dashboard.active {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .admin-navbar {
            position: sticky;
            top: 0;
            height: 60px;
            background: rgba(10, 22, 40, 0.98);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .admin-navbar h2 {
            font-size: 1.2rem;
            background: linear-gradient(135deg, #d4af37, #e8c547);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logout-btn {
            padding: 0.5rem 1.2rem;
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 8px;
            color: #e8c547;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
        }

        .logout-btn:hover {
            background: rgba(212, 175, 55, 0.1);
        }

        .dashboard-content {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #d4af37, #e8c547);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-subtitle {
            color: #b0c4de;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        /* ========== FORM ELEMENTS ========== */
        .form-section {
            background: rgba(13, 31, 60, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .form-section h3 {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            color: #e8c547;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.7rem 0.9rem;
            background: rgba(10, 22, 40, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.15);
        }

        .form-group textarea {
            grid-column: 1 / -1;
            resize: vertical;
            min-height: 80px;
        }

        .form-group-full {
            grid-column: 1 / -1;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            font-size: 0.9rem;
            color: #b0c4de;
        }

        /* ========== BUTTONS ========== */
        .btn-save {
            padding: 0.7rem 1.5rem;
            background: linear-gradient(135deg, #d4af37, #e8c547);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }

        .btn-delete {
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid rgba(255, 107, 107, 0.4);
            border-radius: 6px;
            color: #ff6b6b;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.8rem;
        }

        .btn-delete:hover {
            background: rgba(255, 107, 107, 0.1);
        }

        .btn-edit {
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 6px;
            color: #e8c547;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.8rem;
            margin-right: 0.5rem;
        }

        .btn-edit:hover {
            background: rgba(212, 175, 55, 0.1);
        }

        .btn-cancel {
            padding: 0.6rem 1.2rem;
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            color: #b0c4de;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-cancel:hover {
            background: rgba(212, 175, 55, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-start;
            margin-top: 1.5rem;
        }

        /* ========== ITEMS TABLE ========== */
        .items-section {
            background: rgba(13, 31, 60, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 15px;
            padding: 2rem;
            overflow-x: auto;
        }

        .items-section h3 {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            color: #e8c547;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
        }

        .items-table thead {
            background: rgba(212, 175, 55, 0.1);
        }

        .items-table th {
            padding: 1rem;
            text-align: left;
            color: #e8c547;
            font-weight: 700;
            border-bottom: 2px solid rgba(212, 175, 55, 0.2);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .items-table td {
            padding: 1rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            color: #b0c4de;
        }

        .items-table tbody tr:hover {
            background: rgba(212, 175, 55, 0.05);
        }

        .item-actions {
            display: flex;
            gap: 0.5rem;
        }

        .items-empty {
            text-align: center;
            padding: 3rem;
            color: #b0c4de;
        }

        /* ========== MODALS ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: rgba(13, 31, 60, 0.98);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h3 {
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            color: #e8c547;
        }

        .modal .form-grid {
            margin-bottom: 1.5rem;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }

        /* ========== CONFIRM DIALOG ========== */
        .confirm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 250;
        }

        .confirm-overlay.active {
            display: flex;
        }

        .confirm-box {
            background: rgba(13, 31, 60, 0.98);
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 15px;
            padding: 2rem;
            max-width: 400px;
            text-align: center;
        }

        .confirm-box p {
            color: #e0e0e0;
            margin-bottom: 1.5rem;
            font-size: 1rem;
        }

        .confirm-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        /* ========== TOAST ========== */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .toast {
            padding: 1rem 1.5rem;
            background: rgba(13, 31, 60, 0.98);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 10px;
            color: #e8c547;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 2.7s forwards;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .toast.success {
            border-color: rgba(74, 222, 128, 0.5);
            color: #4ade80;
        }

        .toast.error {
            border-color: rgba(255, 107, 107, 0.5);
            color: #ff6b6b;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes toastOut {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(20px); }
        }

        /* ========== LOADING ========== */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top: 3px solid #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .login-container { margin: 1rem; }
            .dashboard-content { padding: 1rem; }
            .admin-navbar { padding: 0 1rem; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group textarea { grid-column: 1; }
            .items-table { font-size: 0.85rem; }
            .items-table th, .items-table td { padding: 0.5rem; }
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginScreen">
        <div class="login-container">
            <h1>🥛 Kadari Admin</h1>
            <p>Firebase Authentication</p>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="admin@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
                </div>
                <button type="submit" class="login-btn">Sign In</button>
                <p class="login-error" id="loginError"></p>
            </form>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard">
        <nav class="admin-navbar">
            <h2>🥛 Kadari Admin Panel</h2>
            <button class="logout-btn" onclick="logout()">⏻ Logout</button>
        </nav>

        <div class="dashboard-content">
            <!-- ADD ITEM FORM -->
            <div class="form-section">
                <h3>➕ Add New Menu Item</h3>
                <form id="addItemForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Item Name *</label>
                            <input type="text" id="itemName" required placeholder="e.g. Mango Lassi">
                        </div>
                        <div class="form-group">
                            <label>Price (₹) *</label>
                            <input type="number" id="itemPrice" required placeholder="e.g. 80" min="1">
                        </div>
                        <div class="form-group">
                            <label>Unit *</label>
                            <input type="text" id="itemUnit" placeholder="e.g. glass, 500g, 1kg" required>
                        </div>
                        <div class="form-group">
                            <label>Category *</label>
                            <input type="text" id="itemCategory" required placeholder="e.g. Lassi">
                        </div>
                        <div class="form-group">
                            <label>Emoji/Icon</label>
                            <input type="text" id="itemEmoji" placeholder="🥛" maxlength="4" value="🥛">
                        </div>
                        <div class="form-group form-group-full">
                            <label>Description *</label>
                            <textarea id="itemDescription" required placeholder="Describe this item..."></textarea>
                        </div>
                        <div class="form-group form-group-full">
                            <label>Image Upload</label>
                            <input type="file" id="itemImage" accept="image/*" placeholder="Select image">
                            <small style="color: #b0c4de; margin-top: 0.5rem; display: block;">Max 2MB • JPG, PNG, WebP</small>
                            <div id="imageUploadStatus" style="margin-top: 0.5rem; color: #d4af37; display: none;">⏳ Uploading image...</div>
                        </div>
                        <div class="form-group checkbox-group">
                            <input type="checkbox" id="itemAvailable" checked>
                            <label for="itemAvailable">Available</label>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-save">✅ Add Item</button>
                        <button type="reset" class="btn-cancel">Clear Form</button>
                    </div>
                </form>
            </div>

            <!-- ITEMS LIST -->
            <div class="items-section">
                <h3>📋 Menu Items</h3>
                <div id="itemsContainer">
                    <div class="items-empty">
                        <div class="loading"></div>
                        <p>Loading items...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- EDIT ITEM MODAL -->
    <div id="editModal" class="modal-overlay">
        <div class="modal">
            <h3>✏️ Edit Menu Item</h3>
            <form id="editItemForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Item Name *</label>
                        <input type="text" id="editItemName" required>
                    </div>
                    <div class="form-group">
                        <label>Price (₹) *</label>
                        <input type="number" id="editItemPrice" required min="1">
                    </div>
                    <div class="form-group">
                        <label>Unit *</label>
                        <input type="text" id="editItemUnit" required>
                    </div>
                    <div class="form-group">
                        <label>Category *</label>
                        <input type="text" id="editItemCategory" required>
                    </div>
                    <div class="form-group">
                        <label>Emoji/Icon</label>
                        <input type="text" id="editItemEmoji" maxlength="4">
                    </div>
                    <div class="form-group form-group-full">
                        <label>Description *</label>
                        <textarea id="editItemDescription" required></textarea>
                    </div>
                    <div class="form-group form-group-full">
                        <label>Image Upload (Optional - leave empty to keep current)</label>
                        <input type="file" id="editItemImage" accept="image/*" placeholder="Select new image">
                        <small style="color: #b0c4de; margin-top: 0.5rem; display: block;">Max 2MB • JPG, PNG, WebP</small>
                        <div id="editImageUploadStatus" style="margin-top: 0.5rem; color: #d4af37; display: none;">⏳ Uploading image...</div>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="editItemAvailable">
                        <label for="editItemAvailable">Available</label>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn-save">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- DELETE CONFIRM DIALOG -->
    <div id="deleteConfirm" class="confirm-overlay">
        <div class="confirm-box">
            <p id="deleteConfirmText">Are you sure you want to delete this item?</p>
            <div class="confirm-actions">
                <button class="btn-cancel" onclick="closeDeleteConfirm()">Cancel</button>
                <button class="btn-delete" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- FIREBASE & SCRIPTS -->
    <script type="module">
        import {
            db,
            auth,
            initialized,
            collection,
            getDocs,
            addDoc,
            updateDoc,
            deleteDoc,
            doc,
            query,
            where,
            serverTimestamp,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        } from './js/firebase-config.js';

        // ========================
        // CLOUDINARY CONFIGURATION
        // ========================
        // TODO: Replace with your Cloudinary credentials
        // Get these from: https://cloudinary.com/console/settings/api-keys
        const CLOUDINARY_CONFIG = {
            cloudName: 'dfkxzt0a9',        // e.g., 'demo', 'my-restaurant'
            uploadPreset: 'kadari_menu_upload'   // e.g., 'unsigned_upload', 'restaurant_images'
        };

        // ========================
        // CLOUDINARY UPLOAD FUNCTION
        // ========================
        /**
         * Upload image to Cloudinary
         * @param {File} file - Image file to upload
         * @returns {Promise<string>} - Secure URL of uploaded image
         */
        async function uploadImageToCloudinary(file) {
            try {
                // Validate file type
                const validTypes = ['image/jpeg', 'image/png', 'image/webp'];
                if (!validTypes.includes(file.type)) {
                    throw new Error('Invalid file type. Only JPG, PNG, WebP allowed.');
                }

                // Validate file size (max 2MB)
                const maxSize = 2 * 1024 * 1024; // 2MB
                if (file.size > maxSize) {
                    throw new Error('File too large. Max 2MB allowed.');
                }

                // Show loading status
                console.log('📤 Uploading image to Cloudinary...');

                // Create FormData
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', CLOUDINARY_CONFIG.uploadPreset);
                formData.append('tags', 'kadari_lassi');

                // Upload to Cloudinary
                const endpoint = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CONFIG.cloudName}/image/upload`;
                const response = await fetch(endpoint, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || 'Upload failed');
                }

                const data = await response.json();
                const imageUrl = data.secure_url;

                console.log('✅ Image uploaded successfully:', imageUrl);
                return imageUrl;

            } catch (error) {
                console.error('❌ Cloudinary upload error:', error);
                throw error;
            }
        }

        // ========================
        // STATE
        // ========================
        let currentUser = null;
        let currentEditingId = null;
        let pendingDeleteId = null;
        let allItems = [];

        // ========================
        // AUTHENTICATION
        // ========================
        // Check auth state on page load
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                showDashboard();
                loadItems();
            } else {
                currentUser = null;
                showLoginScreen();
            }
        });

        // Handle login form
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');

            try {
                errorEl.textContent = '';
                errorEl.classList.remove('show');
                await signInWithEmailAndPassword(auth, email, password);
                // Redirect happens via onAuthStateChanged
            } catch (error) {
                errorEl.textContent = error.message || 'Login failed. Check your credentials.';
                errorEl.classList.add('show');
                console.error('Login error:', error);
            }
        });

        window.logout = async function() {
            try {
                await signOut(auth);
                currentUser = null;
                showLoginScreen();
                showToast('Logged out', 'success');
            } catch (error) {
                console.error('Logout error:', error);
                showToast(error.message, 'error');
            }
        };

        // ========================
        // UI FUNCTIONS
        // ========================
        function showLoginScreen() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';
        }

        function showDashboard() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboard').classList.add('active');
        }

        // ========================
        // FIRESTORE CRUD
        // ========================
        /**
         * Load all menu items from Firestore
         */
        async function loadItems() {
            try {
                if (!db) {
                    throw new Error('Firestore not initialized');
                }

                const q = query(collection(db, 'menuItems'));
                const snapshot = await getDocs(q);
                
                allItems = [];
                snapshot.forEach((doc) => {
                    allItems.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                renderItemsTable();
                console.log('✅ Loaded ' + allItems.length + ' items');
            } catch (error) {
                console.error('Error loading items:', error);
                showToast('Failed to load items: ' + error.message, 'error');
            }
        }

        /**
         * Add new item to Firestore
         */
        async function addItem(itemData) {
            try {
                if (!db) throw new Error('Firestore not initialized');

                const newItem = {
                    ...itemData,
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                };

                const docRef = await addDoc(collection(db, 'menuItems'), newItem);
                console.log('✅ Item added with ID:', docRef.id);
                showToast('✅ Item added successfully!', 'success');
                
                // Reset form and reload
                document.getElementById('addItemForm').reset();
                await loadItems();
                
            } catch (error) {
                console.error('Error adding item:', error);
                showToast('Failed to add item: ' + error.message, 'error');
            }
        }

        /**
         * Update existing item in Firestore
         */
        async function updateItem(itemId, itemData) {
            try {
                if (!db) throw new Error('Firestore not initialized');

                const itemRef = doc(db, 'menuItems', itemId);
                await updateDoc(itemRef, {
                    ...itemData,
                    updatedAt: serverTimestamp()
                });

                console.log('✅ Item updated:', itemId);
                showToast('✅ Item updated successfully!', 'success');
                closeEditModal();
                await loadItems();
                
            } catch (error) {
                console.error('Error updating item:', error);
                showToast('Failed to update item: ' + error.message, 'error');
            }
        }

        /**
         * Delete item from Firestore
         */
        async function deleteItem(itemId) {
            try {
                if (!db) throw new Error('Firestore not initialized');

                await deleteDoc(doc(db, 'menuItems', itemId));
                console.log('✅ Item deleted:', itemId);
                showToast('✅ Item deleted successfully!', 'success');
                closeDeleteConfirm();
                await loadItems();
                
            } catch (error) {
                console.error('Error deleting item:', error);
                showToast('Failed to delete item: ' + error.message, 'error');
            }
        }

        // ========================
        // FORM HANDLERS
        // ========================
        /**
         * Handle add item form submission
         */
        document.getElementById('addItemForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const imageInput = document.getElementById('itemImage');
            let imageUrl = '';

            try {
                // Upload image if provided
                if (imageInput.files && imageInput.files[0]) {
                    const uploadStatus = document.getElementById('imageUploadStatus');
                    uploadStatus.style.display = 'block';
                    const submitBtn = e.target.querySelector('button[type="submit"]');
                    submitBtn.disabled = true;

                    imageUrl = await uploadImageToCloudinary(imageInput.files[0]);
                    uploadStatus.style.display = 'none';
                    submitBtn.disabled = false;
                }

                const itemData = {
                    name: document.getElementById('itemName').value,
                    price: parseFloat(document.getElementById('itemPrice').value),
                    unit: document.getElementById('itemUnit').value,
                    category: document.getElementById('itemCategory').value,
                    description: document.getElementById('itemDescription').value,
                    emoji: document.getElementById('itemEmoji').value || '�75',
                    image: imageUrl,
                    available: document.getElementById('itemAvailable').checked
                };

                await addItem(itemData);
            } catch (error) {
                document.getElementById('imageUploadStatus').style.display = 'none';
                e.target.querySelector('button[type="submit"]').disabled = false;
                showToast('Image upload failed: ' + error.message, 'error');
            }
        });

        /**
         * Handle edit item form submission
         */
        document.getElementById('editItemForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!currentEditingId) return;

            const editImageInput = document.getElementById('editItemImage');
            const currentItem = allItems.find(i => i.id === currentEditingId);
            let imageUrl = currentItem?.image || ''; // Keep existing image if not replaced

            try {
                // Upload new image if provided
                if (editImageInput.files && editImageInput.files[0]) {
                    const uploadStatus = document.getElementById('editImageUploadStatus');
                    uploadStatus.style.display = 'block';
                    const submitBtn = e.target.querySelector('button[type="submit"]');
                    submitBtn.disabled = true;

                    imageUrl = await uploadImageToCloudinary(editImageInput.files[0]);
                    uploadStatus.style.display = 'none';
                    submitBtn.disabled = false;
                }

                const itemData = {
                    name: document.getElementById('editItemName').value,
                    price: parseFloat(document.getElementById('editItemPrice').value),
                    unit: document.getElementById('editItemUnit').value,
                    category: document.getElementById('editItemCategory').value,
                    description: document.getElementById('editItemDescription').value,
                    emoji: document.getElementById('editItemEmoji').value || '🥛',
                    image: imageUrl,
                    available: document.getElementById('editItemAvailable').checked
                };

                await updateItem(currentEditingId, itemData);
            } catch (error) {
                document.getElementById('editImageUploadStatus').style.display = 'none';
                e.target.querySelector('button[type="submit"]').disabled = false;
                showToast('Image upload failed: ' + error.message, 'error');
            }
        });

        // ========================
        // MODAL FUNCTIONS
        // ========================
        window.openEditModal = function(itemId) {
            const item = allItems.find(i => i.id === itemId);
            if (!item) return;

            currentEditingId = itemId;
            document.getElementById('editItemName').value = item.name;
            document.getElementById('editItemPrice').value = item.price;
            document.getElementById('editItemUnit').value = item.unit || '';
            document.getElementById('editItemCategory').value = item.category;
            document.getElementById('editItemDescription').value = item.description;
            document.getElementById('editItemEmoji').value = item.emoji || '🥛';
            // Clear file input (cannot set value for security reasons)
            document.getElementById('editItemImage').value = '';
            document.getElementById('editItemAvailable').checked = item.available !== false;

            document.getElementById('editModal').classList.add('active');
        };

        window.closeEditModal = function() {
            document.getElementById('editModal').classList.remove('active');
            currentEditingId = null;
        };

        window.openDeleteConfirm = function(itemId) {
            const item = allItems.find(i => i.id === itemId);
            if (!item) return;

            pendingDeleteId = itemId;
            document.getElementById('deleteConfirmText').textContent = 
                `Are you sure you want to delete "${item.name}"?`;
            document.getElementById('deleteConfirm').classList.add('active');
        };

        window.closeDeleteConfirm = function() {
            document.getElementById('deleteConfirm').classList.remove('active');
            pendingDeleteId = null;
        };

        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            if (pendingDeleteId) {
                await deleteItem(pendingDeleteId);
            }
        });

        // ========================
        // RENDER FUNCTIONS
        // ========================
        function renderItemsTable() {
            const container = document.getElementById('itemsContainer');

            if (allItems.length === 0) {
                container.innerHTML = `
                    <div class="items-empty">
                        <p>No menu items yet. Add one using the form above!</p>
                    </div>
                `;
                return;
            }

            let html = `
                <table class="items-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Unit</th>
                            <th>Category</th>
                            <th>Available</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            allItems.forEach(item => {
                const availableBadge = item.available ? '✅ Yes' : '❌ No';
                html += `
                    <tr>
                        <td>${item.emoji || '🥛'} ${item.name}</td>
                        <td>₹${item.price}</td>
                        <td>${item.unit || '-'}</td>
                        <td>${item.category}</td>
                        <td>${availableBadge}</td>
                        <td>
                            <div class="item-actions">
                                <button class="btn-edit" onclick="openEditModal('${item.id}')">Edit</button>
                                <button class="btn-delete" onclick="openDeleteConfirm('${item.id}')">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        // ========================
        // TOAST NOTIFICATIONS
        // ========================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => toast.remove(), 3000);
        }

        // ========================
        // INITIALIZATION
        // ========================
        console.log('%c✨ Kadari Admin - Firebase Edition', 'font-size: 16px; font-weight: bold; color: #d4af37;');
        if (!initialized) {
            showToast('⚠️ Firebase not initialized. Check console for config errors.', 'error');
        }
    </script>
</body>
</html>
